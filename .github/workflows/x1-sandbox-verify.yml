name: Visual X1 sandbox branch validation
on:
  pull_request:
    paths:
      - 'src/components/visualeditor/**'
      - 'src/styles/x1-sandbox-ops.css'
      - 'tests/x1-sandbox-ui.test.mjs'
      - '.github/workflows/x1-sandbox-verify.yml'
  workflow_dispatch:
jobs:
  visual-sandbox:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --test tests/x1-sandbox-ui.test.mjs
      - run: npm run build
      - run: npm run lint
